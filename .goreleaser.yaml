# .goreleaser.yaml — ipapi CLI 跨平台构建与发布
# 打 tag v* 时由 .github/workflows/release.yml 触发。
version: 2

project_name: ipapi

before:
  hooks:
    - go mod tidy

builds:
  - id: ipapi
    main: ./cmd/ipapi/
    binary: ipapi
    env:
      - CGO_ENABLED=0
    targets:
      - linux_amd64
      - linux_arm64
      - darwin_amd64
      - darwin_arm64
      - windows_amd64
      - windows_arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    builds: [ipapi]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin"}}macos
      {{- else if eq .Os "linux"}}linux
      {{- else}}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64"}}x86_64
      {{- else if eq .Arch "arm64"}}arm64
      {{- else}}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - SKILLS.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ incpatch .Version }}-dev'

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'Merge pull request'
      - 'Merge branch'

release:
  draft: true
  name_template: 'ipapi {{ .Version }}'
  header: |
    ## ipapi {{ .Version }}

    命令行 IP 地理位置查询工具。安装：
    ```bash
    go install github.com/cyberspacesec/ipapi.co-skills/cmd/ipapi@{{ .Version }}
    ```
